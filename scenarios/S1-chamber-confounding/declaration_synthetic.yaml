# SYNTHETIC demonstration scenario S1 (chamber confounding). Not physical data and not
# fab data. Generated by scenarios/generate.py; do not edit by hand.
stratum_declaration: 1
claimed_template: T2
description: >
  SYNTHETIC SCENARIO S1. Two recipes applied to whole runs, 3 runs per recipe, 3 wafers per
  run, 5 sites per wafer. Every 'standard' run was processed in chamber A and every
  'modified' run in chamber B.
response:
  column: y
  units: a.u. (synthetic)
hierarchy:
  - name: run
    id_column: run
    count: 6
  - name: wafer
    id_column: wafer
    nested_in: run
    count_per_parent: 3
    id_scope: parent
  - name: site
    id_column: site
    nested_in: wafer
    count_per_parent: 5
    id_scope: parent
    exchangeable: true
treatments:
  - name: recipe
    column: recipe
    levels: [standard, modified]
    applied_to: run
    replicates_per_level: 3
    assignment:
      method: systematic
      description: Each recipe was run in its own chamber (synthetic scenario).
nuisance_factors:
  - name: chamber
    column: chamber
    recorded_at: run
    role: recorded
    levels: [A, B]
comparisons:
  - id: modified_vs_standard
    kind: pairwise
    factors: [recipe]
    levels: [modified, standard]
    description: Mean response, modified minus standard.
