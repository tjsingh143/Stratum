<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc">
<title id="title">Evidence regeneration and full replay</title><desc id="desc">The canonical workflow uses source data, synthetic definitions and frozen ledgers. Recomputing ledger metrics is distinct from replaying all seeded simulations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="690" fill="#f8fafc"/>
<text x="48" y="57" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Rebuilding evidence is not a new simulation study</text>
<text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155">Canonical reproduction and the separate expensive replay</text>
<rect x="48" y="145" width="280" height="91" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Pinned published sources</text>
<text x="68" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Verified data + R environment</text>
<rect x="410" y="145" width="280" height="91" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Synthetic definitions</text>
<text x="430" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Declarations, fixtures, scenarios</text>
<rect x="772" y="145" width="280" height="91" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="792" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Frozen attempt ledgers</text>
<text x="792" y="203" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">All seeded attempts retained</text>
<rect x="48" y="300" width="280" height="111" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="68" y="331" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">R reference replay</text>
<text x="68" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Export fresh CSVs</text>
<text x="68" y="381" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Compare all retained R bytes</text>
<path d="M188 236 V300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="300" width="280" height="111" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="430" y="331" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Current engine execution</text>
<text x="430" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Check decisions and assertions</text>
<text x="430" y="381" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Generate JSON and reports</text>
<path d="M550 236 V300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="772" y="300" width="280" height="111" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="792" y="331" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Ledger reconciliation</text>
<text x="792" y="358" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Recompute every cell metric</text>
<text x="792" y="381" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Retain adverse results and alerts</text>
<path d="M912 236 V300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="244" y="477" width="612" height="92" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="264" y="508" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Current reports + verification gate</text>
<text x="264" y="535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">Derived outputs must agree with their inputs and retained evidence.</text>
<path d="M188 411 V447 H550 V477" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 411 V447 H550 V477" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M912 411 V447 H550 V477" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="601" width="1004" height="64" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="68" y="632" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Separate full seeded replay</text>
<text x="390" y="632" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#334155">Same original draws and analyses → compare complete ledgers</text>
</svg>
