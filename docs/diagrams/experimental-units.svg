<text x="68" y="509" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">What determines treatment uncertainty?</text>
<text x="68" y="536" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">Within-run measurements share a run effect. Independent run replication supplies treatment error.</text>
<text x="68" y="559" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569">The other treatment needs its own replicated runs; balance alone cannot establish independence.</text>
